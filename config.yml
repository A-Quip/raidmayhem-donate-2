# Prices for the SECOND donate page. This file is standalone — unlike donate-site/,
# which reads the plugin's config.yml, this page is driven entirely by the values here.
# Edit prices/markers below (and the site: block), then run build_page.py.

site:
  # StreamElements (or any) tip page this donate button links to. The channel name
  # shown on the page is the first path segment of this URL.
  tip-url: "https://streamelements.com/molyhydra/tip"
  # Amount-independent effects (they fire once, whatever was tipped). Keys must match
  # the plugin's EFFECT:<name> markers.
  effects:
    heal: "Heals all runners to full and refills their hunger and saturation."

# Hard cap on mobs advertised on the page (count = amount / price, capped here).
mobs:
  max-per-donation: 256

# Mobs a donor can summon with MOB:<name>, mapped to cost per mob.
mob-whitelist:
  # # Undead
  zombie: 0.5
  husk: 1.0
  drowned: 1.0

  skeleton: 1.5
  stray: 1.75
  parched: 1.75
  bogged: 3.5

  phantom: 2.0
  large_phantom: 3.0
  huge_phantom: 4.0
  # # Arachnid
  endermite: 0.5
  spider: .5
  cave_spider: 1.5
  silverfish: 0.5
  # # Other
  villager: 0.5
  llama: 0.2
  goat: 1.0
  polar_bear: 1.0
  creeper: 1.5
  breeze: 2.5
  enderman: 3.0
  warden: 4.0
  # # Illagers
  pillager: 1.75
  vindicator: 3.5
  witch: 4.0
  illusioner: 3.5
  evoker: 4.0
  ravager: 4.5
  # Nether
  hoglin: 2.5
  zoglin: 2.5
  piglin: 3.5
  zombified_piglin: 2.0
  wither_skeleton: 3.0
  blaze: 4.0
  ghast: 3.0
  piglin_brute: 5.0
  # # Boss
  wither: 50.00

# Items a donor can request with ITEM:<name>, mapped to cost per item.
gifts:
  # The ONLY items a donor may request with ITEM:<name>, mapped to cost per item in
  # currency units (count = amount / cost). An ITEM marker naming anything not listed
  # here is rejected and falls through to donations.default-effect. Keys are item
  # material names (lowercase, "_" for spaces; e.g. golden_apple).
  whitelist:
    iron_ingot: 0.2
    gold_ingot: 0.2
    diamond: 0.5
    emerald: 0.1
    totem_of_undying: 4.0
    golden_apple: 2.0
    golden_carrot: 0.4
    bread: 0.1
    oak_log: 0.1
    experience_bottle: 0.1
    lapis_lazuli: 0.1
  # Resource handed to every online target for a keywordless donation when
  # donations.default-effect is "gift" (the default). Any item material name, priced
  # from the whitelist above (1.0 if it isn't listed there).
  default: iron_ingot
  # Hard cap on items given per single donation (per target).
  max-per-donation: 512
